components:
  schemas:
    AdminUser:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userName:
          type: string
        mobile:
          type: string
        name:
          type: string
        email:
          type: string
        avatar:
          type: string
        lastLoginTime:
          type: string
        lastLoginIp:
          type: string
        status:
          type: integer
          format: int32
          description: 用户状态
        depart_id:
          type: integer
          format: int64
        gmtCreate:
          type: string
        gmtModified:
          type: string
        creator:
          $ref: '#/components/schemas/IDName'
    AftersaleSimple:
      type: object
      description: 售后单简要信息（列表用）
      properties:
        id:
          type: integer
          format: int64
          description: 售后单ID
        aftersaleSn:
          type: string
          description: 售后单序号
        orderItemId:
          type: integer
          format: int64
          description: 订单明细ID
        status:
          type: integer
          description: 售后单整体状态：0-处理中 1-已完成 2-已取消
          enum:
            - 0
            - 1
            - 2
        reason:
          type: string
          description: 售后原因
        createdAt:
          type: string
          format: date-time
          description: 申请时间
        updatedAt:
          type: string
          format: date-time
          description: 更新时间
        items:
          type: array
          description: 售后商品明细简要信息
          items:
            type: object
            properties:
              id:
                type: integer
                format: int64
                description: 明细ID
              productName:
                type: string
                description: 商品名称
              type:
                type: integer
                description: 售后类型：0-换货 1-退货 2-寄修 3-上门维修
                enum:
                  - 0
                  - 1
                  - 2
                  - 3
              itemStatus:
                type: integer
                description: 明细状态：0-申请中 1-待验收 2-待上门 3-已取消 4-已验收 5-维修中 6-已完成
                enum:
                  - 0
                  - 1
                  - 2
                  - 3
                  - 4
                  - 5
                  - 6
              quantity:
                type: integer
                description: 数量
    AvailableAftersaleOrderItem:
      type: object
      description: 可申请售后的订单明细
      properties:
        orderItemId:
          type: integer
          format: int64
          description: 订单明细ID
        orderId:
          type: integer
          format: int64
          description: 订单ID
        productId:
          type: integer
          format: int64
          description: 商品ID
        productName:
          type: string
          description: 商品名称
        productImageUrl:
          type: string
          description: 商品图片URL
        specs:
          type: string
          description: 商品规格
        quantity:
          type: integer
          description: 订购数量
        availableQuantity:
          type: integer
          description: 可申请售后的数量
        price:
          type: integer
          format: int64
          description: 商品单价（分）
        aftersaleDeadline:
          type: string
          format: date-time
          description: 售后截止时间
        orderTime:
          type: string
          format: date-time
          description: 下单时间
    ProxyUser:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userA:
          $ref: '#/components/schemas/IDName'
        userB:
          $ref: '#/components/schemas/IDName'
        beginDate:
          type: string
        endDate:
          type: string
        valid:
          type: boolean
        gmtCreate:
          type: string
    AftersaleDetail:
      type: object
      description: 售后单详细信息
      properties:
        id:
          type: integer
          format: int64
          description: 售后单ID
        aftersaleSn:
          type: string
          description: 售后单序号
        shopId:
          type: integer
          format: int64
          description: 店铺ID
        orderItemId:
          type: integer
          format: int64
          description: 订单明细ID
        customerId:
          type: integer
          format: int64
          description: 顾客ID
        status:
          type: integer
          description: 售后单整体状态：0-处理中 1-已完成 2-已取消
          enum:
            - 0
            - 1
            - 2
        reason:
          type: string
          description: 售后原因
        cancelReason:
          type: string
          description: 取消原因（商户取消时填写）
        regionId:
          type: integer
          format: int64
          description: 取货地区ID
        address:
          type: string
          description: 取货详细地址
        contact:
          type: string
          description: 联系人
        mobile:
          type: string
          description: 联系电话
        serviceId:
          type: integer
          format: int64
          description: 服务单ID（上门维修时）
        refundId:
          type: integer
          format: int64
          description: 退款单ID
        createdAt:
          type: string
          format: date-time
          description: 申请时间
        updatedAt:
          type: string
          format: date-time
          description: 更新时间
        items:
          type: array
          description: 售后商品明细
          items:
            $ref: '#/components/schemas/AftersaleItem'
        packages:
          type: array
          description: 物流信息
          items:
            $ref: '#/components/schemas/AftersalePackage'
        progress:
          type: array
          description: 服务进度
          items:
            $ref: '#/components/schemas/AftersaleProgress'
        history:
          type: array
          description: 处理轨迹（按时间倒序）
          items:
            $ref: '#/components/schemas/AftersaleHistory'
    AftersaleCreateRequest:
      type: object
      description: 创建售后请求
      required:
        - reason
        - items
      properties:
        reason:
          type: string
          description: 售后原因
        regionId:
          type: integer
          format: int64
          description: 取货地区ID
        address:
          type: string
          description: 取货详细地址
        contact:
          type: string
          description: 联系人
        mobile:
          type: string
          description: 联系电话
        items:
          type: array
          description: 售后商品明细列表
          items:
            type: object
            required:
              - productId
              - type
              - quantity
            properties:
              productId:
                type: integer
                format: int64
                description: 商品ID
              type:
                type: integer
                description: 售后类型：0-换货 1-退货 2-寄修 3-上门维修
                enum:
                  - 0
                  - 1
                  - 2
                  - 3
              quantity:
                type: integer
                description: 申请数量
              specificReason:
                type: string
                description: 具体原因描述
              evidenceUrl:
                type: string
                description: 售后凭证图片URL
              serialNo:
                type: string
                description: 商品序列号（SN码）
    Role:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        desc:
          type: string
        departId:
          type: integer
        gmtCreate:
          type: string
        gmtModified:
          type: string
        creator:
          $ref: '#/components/schemas/IDName'
        modifier:
          $ref: '#/components/schemas/IDName'
    AftersaleItem:
      type: object
      description: 售后商品明细
      properties:
        id:
          type: integer
          format: int64
          description: 明细ID
        aftersaleId:
          type: integer
          format: int64
          description: 售后单ID
        productId:
          type: integer
          format: int64
          description: 商品ID
        productName:
          type: string
          description: 商品名称
        productImageUrl:
          type: string
          description: 商品图片URL
        quantity:
          type: integer
          description: 数量
        evidenceUrl:
          type: string
          description: 售后凭证图片URL
        serialNo:
          type: string
          description: 商品序列号（SN码）
        specificReason:
          type: string
          description: 具体原因
        type:
          type: integer
          description: 售后类型：0-换货 1-退货 2-寄修 3-上门维修
          enum:
            - 0
            - 1
            - 2
            - 3
        conclusion:
          type: string
          description: 处理结论
        itemStatus:
          type: integer
          description: 明细状态：0-申请中 1-待验收 2-待上门 3-已取消 4-已验收 5-维修中 6-已完成
          enum:
            - 0
            - 1
            - 2
            - 3
            - 4
            - 5
            - 6
    AftersaleUpdateRequest:
      type: object
      description: 修改售后请求
      properties:
        reason:
          type: string
          description: 售后原因
        regionId:
          type: integer
          format: int64
          description: 取货地区ID
        address:
          type: string
          description: 取货详细地址
        contact:
          type: string
          description: 联系人
        mobile:
          type: string
          description: 联系电话
        items:
          type: array

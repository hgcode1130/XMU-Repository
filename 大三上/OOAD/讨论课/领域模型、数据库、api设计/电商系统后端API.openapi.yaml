          items:
            type: object
            required:
              - aftersaleItemId
            properties:
              aftersaleItemId:
                type: integer
                format: int64
                description: 售后明细ID
              quantity:
                type: integer
                description: 申请数量
              specificReason:
                type: string
                description: 具体原因描述
              evidenceUrl:
                type: string
                description: 售后凭证图片URL
              serialNo:
                type: string
                description: 商品序列号（SN码）

        - **触发方式**：填写完售后信息后，点击「提交」按钮
        - **界面元素**：图1-1 维修申请页面的提交按钮

        ## 业务规则
        - 一个售后单可以包含多个商品明细
        - 每个明细可以指定不同的处理方式（换货/退货/寄修/维修）
        - 申请的数量不能超过订单明细中的可售后数量
        - 创建后售后单状态为 0-处理中，明细状态为 0-申请中

        ## 状态转换
        - 创建成功后：aftersale.status = 0, aftersale_items.item_status = 0
      operationId: createAftersale
      tags:
        - aftersale
      parameters:
        - name: id
          in: path
          description: 订单明细ID
          required: true
          example: 0
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AftersaleCreateRequest'
        required: true
      responses:
        '201':
          description: 售后申请创建成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  errno:
                    type: integer
                    example: 0
                  errmsg:
                    type: string
                    example: 成功
                  data:
                    $ref: '#/components/schemas/AftersaleDetail'
          headers: {}
        '400':
          description: 参数错误或申请数量超过可售后数量
          headers: {}
        '401':
          description: 未登录
          headers: {}
        '404':
          description: 订单明细不存在
          headers: {}
        '409':
          description: 该订单明细不支持申请售后
          headers: {}
      security:
        - bearerAuth: []

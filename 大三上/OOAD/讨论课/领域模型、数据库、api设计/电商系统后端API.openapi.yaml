openapi: 3.0.1
info:
  title: 电商系统后端API
  description: |-
    - 2025年软件工程专业《软件工程》、《面向对象分析分析与设计》、《JavaEE平台技术》课程设计API

    - 通用错误处理
    所有在路径上的id不存在，返回状态码404，errno = 4， errmsg 自定义
    所有参数的错误返回状态码400，errno = 3， errmsg 自定义
    未登录的状态码为401
    没有权限访问， 返回状态码403，errno = 16
    访问的对象不是本shop的对象，返回状态码403，errno = 17， errmsg 自定义
    - API中时间格式的定义
    统一为yyyy-MM-ddTHH:mm:ss.SSS 
    如2016-05-09T13:09:55.235 表示2016年05月09日13点09分55秒235毫秒，时区为应用服务器所在地时区
    - 顾客和后台管理人员兼容登录的token
      顾客的token，departId为-100
      管理人员的token为-1，表示未开店的后台人员，0为平台管理人员， >=1的值为shopId
      当试图用顾客的token访问后台API时，需抛出错误3
      后台管理员token可以正常访问顾客API。
      
  version: 1.4.0
  termsOfService: http://swagger.io/terms/
  contact:
    email: mingqiu@xmu.edu.cn
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
tags:
  - name: aftersale
  - name: 商户-服务管理
  - name: 商户-服务合同管理
  - name: 商户-服务单管理
  - name: 服务商-服务合同管理
  - name: 服务商-服务单管理
  - name: 维修师傅-服务单管理
  - name: 平台管理员-服务商管理
paths:
  /shops/{shopId}/aftersales:
    get:
      summary: 商户查询售后列表
      deprecated: false
      description: |-
        ## 用例对应
        对应用例 MALL-AFTERSALE-001
        - 步骤 1：商户按多条件查询售后
        - 步骤 2：系统显示符合条件的售后列表

        ## 界面对应
        - **触发方式**：进入「售后处理中心」页面、点击状态筛选标签、修改筛选条件
        - **界面元素**：
          - 状态筛选标签 (pill-tabs)：待审核/处理中/待收货/已完成
          - 筛选条件：售后单号、售后类型、顾客电话、运单号
          - 列表表格：售后单号、顾客、申请时间、售后类型、状态、操作

        ## 界面状态映射
        界面简化状态与API状态的映射关系：
        - 待审核 → status=0
        - 处理中 → status=1,2 (待验收+待上门)
        - 待收货 → status=4,5 (已验收+维修中)
        - 已完成 → status=6
        - 已取消 → status=3 (界面建议增加此筛选)
      operationId: listAftersales
      tags:
        - aftersale
      parameters:
        - name: shopId
          in: path
          description: 商户店铺ID
          required: true
          example: 0
          schema:
            type: integer
            format: int64
        - name: aftersaleSn
          in: query
          description: 售后单号
          required: false
          schema:
            type: string
        - name: orderItemId
          in: query
          description: 订单明细ID
          required: false
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          description: 售后状态：0-申请中 1-待验收 2-待上门 3-已取消 4-已验收 5-维修中 6-已完成
          required: false
          schema:
            type: integer
            enum:
              - 0
              - 1
              - 2
              - 3
              - 4
              - 5
              - 6
        - name: type
          in: query
          description: 售后类型：0-退货 1-换货 2-寄修 3-上门维修
          required: false
          schema:
            type: integer
            enum:
              - 0
              - 1
              - 2
              - 3
        - name: customerPhone
          in: query
          description: 顾客电话
          required: false
          schema:
            type: string
        - name: waybillNo
          in: query
          description: 运单号
          required: false
          schema:
            type: string
        - name: regionId
          in: query
          description: 地区ID
          required: false
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          description: 页码，从1开始
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          description: 每页数目
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: 成功返回售后列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  errno:
                    type: integer
                    example: 0
                  errmsg:
                    type: string
                    example: 成功
                  data:
                    type: object
                    properties:
                      page:
                        type: integer
                        description: 当前页码
                      pageSize:
                        type: integer
                        description: 每页数目
                      total:
                        type: integer
                        description: 总记录数
                      list:
                        type: array
                        items:
                          $ref: '#/components/schemas/AftersaleSimple'
          headers: {}
        '401':
          description: 未登录
          headers: {}
        '403':
          description: 无权限访问该店铺
          headers: {}
      security:
        - bearerAuth: []
  /shops/{shopId}/aftersales/{id}:
    get:
      summary: 商户查看售后详情
      deprecated: false
      description: |-
        ## 用例对应
        对应用例 MALL-AFTERSALE-001 步骤 3-4
        - 步骤 3：用户点击具体要查看的售后
        - 步骤 4：系统显示所选售后的详细信息

        ## 界面对应
        - **触发方式**：点击列表中的「详情」按钮、点击「查看服务单」按钮
        - **界面元素**：售后详情弹窗 (openAftersaleDetail)
        - **显示内容**：
          - 顾客信息：姓名、电话、关联订单
          - 售后概览：类型、状态、申请时间
          - 问题描述：原因、附件数量
          - 处理记录：时间线轨迹
          - 服务单信息（如有）：服务单号、类型、指派人、状态、物流信息、处理步骤
      operationId: getAftersaleDetail
      tags:
        - aftersale
      parameters:
        - name: shopId
          in: path
          description: 商户店铺ID
          required: true
          example: 0
          schema:
            type: integer
            format: int64
        - name: id
          in: path
          description: 售后单ID
          required: true
          example: 0
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 成功返回售后详情
          content:
            application/json:
              schema:
                type: object
                properties:
                  errno:
                    type: integer
                    example: 0
                  errmsg:
                    type: string
                    example: 成功
                  data:
                    $ref: '#/components/schemas/AftersaleDetail'
          headers: {}
        '403':
          description: 该售后单不属于本店铺
          headers: {}
        '404':
          description: 售后单不存在
          headers: {}
      security:
        - bearerAuth: []
  /shops/{shopId}/aftersales/{id}/review:
    put:
      summary: 商户审核售后申请
      deprecated: false
      description: |-
        ## 用例对应
        对应用例 MALL-AFTERSALE-002
        - 步骤 4：商户审核后同意售后申请
        - 扩展 4a：商户不同意售后申请
        - 扩展 4b：商户修改售后类型后同意
        - 步骤 5：系统根据类型自动生成运单或服务单

        ## 界面对应
        - **触发方式**：
          - 点击「审核通过」按钮 → approved=true
          - 点击「驳回申请」按钮 → approved=false
        - **界面元素**：
          - 审核通过弹窗：可选择/修改售后类型（退货/换货/寄修/上门维修）
          - 驳回申请弹窗：需填写驳回原因
        - **操作条件**：仅在 status=0(待审核) 时显示这两个按钮

        ## 状态转换
        - 同意 + 退货/换货/寄修(type=0,1,2) → 状态变为 1-PENDING_INSPECTION，产生运单
        - 同意 + 上门维修(type=3) → 状态变为 2-PENDING_ONSITE，产生服务单
        - 拒绝 → 状态变为 3-CANCELLED
      operationId: reviewAftersale
      tags:
        - aftersale
      parameters:
        - name: shopId
          in: path
          description: 商户店铺ID
          required: true
          example: 0
          schema:
            type: integer
            format: int64
        - name: id
          in: path
          description: 售后单ID
          required: true
          example: 0
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 审核成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  errno:
                    type: integer
                    example: 0
                  errmsg:
                    type: string
                    example: 成功
                  data:
                    $ref: '#/components/schemas/AftersaleDetail'
          headers: {}
        '400':
          description: 参数错误
          headers: {}
        '404':
          description: 售后单不存在
          headers: {}
        '409':
          description: 当前状态不允许审核（非申请中状态）
          headers: {}
      security:
        - bearerAuth: []
  /shops/{shopId}/aftersales/{id}/inspection:
    put:
      summary: 商户验收售后商品
      deprecated: false
      description: |-
        ## 用例对应
        对应用例 MALL-AFTERSALE-003
        - 步骤 3：商户确认商品验收通过
        - 步骤 4：系统更新售后状态为已验收
        - 扩展 4a：商户发现退回商品不符售后条件，拒收

        ## 界面对应
        - **触发方式**：
          - 点击「确认收货」按钮
          - 点击顶部「按运单收货」按钮 → 输入运单号查询 → 验收确认弹窗
        - **界面元素**：
          - 验收确认弹窗 (openAftersaleReceiveConfirm)
          - 验收结果选择：通过/不通过
          - 异常说明输入框（不通过时填写）
        - **操作条件**：仅在 status=1(待验收) 或 status=2(待上门) 时可操作

        ## 状态转换
        - 从 1-PENDING_INSPECTION 验收通过 → 4-ACCEPTED
        - 从 2-PENDING_ONSITE 验收通过 → 5-REPAIRING
        - 验收不通过 → 3-CANCELLED
      operationId: inspectAftersale
      tags:
        - aftersale
      parameters:
        - name: shopId
          in: path
          description: 商户店铺ID
          required: true
          example: 0
          schema:
            type: integer
            format: int64
        - name: id
          in: path
          description: 售后单ID
          required: true
          example: 0
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 验收结果提交成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  errno:
                    type: integer
                    example: 0
                  errmsg:
                    type: string
                    example: 成功
                  data:
                    $ref: '#/components/schemas/AftersaleDetail'
          headers: {}
        '400':
          description: 参数错误
          headers: {}
        '404':
          description: 售后单不存在
          headers: {}
        '409':
          description: 当前状态不允许验收（非待验收/待上门状态）
          headers: {}
      security:
        - bearerAuth: []
  /shops/{shopId}/aftersales/{id}/complete:
    put:
      summary: 商户完成售后
      deprecated: false
      description: |-
        ## 用例对应
        将售后单标记为已完成，对应售后处理的最终步骤

        ## 界面对应
        - **触发方式**：点击「完成售后」按钮（界面当前使用「登记处理结果」弹窗中的状态更新）
        - **界面元素**：登记处理结果弹窗 (openAftersaleLogForm) 中选择「完成售后」
        - **操作条件**：仅在 status=4(已验收) 或 status=5(维修中) 时可操作
        - **界面建议**：建议增加独立的「完成售后」按钮，与「登记备注」分离

        ## 状态转换
        - 从 4-ACCEPTED → 6-COMPLETED（退货/换货/寄修完成）
        - 从 5-REPAIRING → 6-COMPLETED（上门维修完成）
      operationId: completeAftersale
      tags:
        - aftersale
      parameters:
        - name: shopId
          in: path
          description: 商户店铺ID
          required: true
          example: 0
          schema:
            type: integer
            format: int64
        - name: id
          in: path
          description: 售后单ID
          required: true
          example: 0
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 完成成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  errno:
                    type: integer
                    example: 0
                  errmsg:
                    type: string
                    example: 成功
                  data:
                    $ref: '#/components/schemas/AftersaleDetail'
          headers: {}
        '404':
          description: 售后单不存在
          headers: {}
        '409':
          description: 当前状态不允许完成（非已验收/维修中状态）
          headers: {}
      security:
        - bearerAuth: []
  /shops/{shopId}/aftersales/{id}/cancel:
    put:
      summary: 商户取消售后
      deprecated: false
      description: |
        ## 用例对应
        取消售后单，对应售后处理的异常终止流程

        ## 界面对应
        - **触发方式**：点击「取消售后」按钮
        - **界面元素**：取消确认弹窗，需填写取消原因
        - **操作条件**：仅在非终态状态时可操作，即除了已完成(6)和已取消(3)外的所有状态
        - **界面问题**：当前界面缺少「取消售后」按钮，建议在已验收/维修中状态增加此操作

        ## 状态转换：
        - 从 0-PENDING_REVIEW → 3-CANCELLED（取消待审核的售后）
        - 从 1-PENDING_INSPECTION → 3-CANCELLED（取消待验收的售后）
        - 从 2-PENDING_ONSITE → 3-CANCELLED（取消待上门的售后）
        - 从 4-ACCEPTED → 3-CANCELLED（取消已验收的售后）
        - 从 5-REPAIRING → 3-CANCELLED（取消维修中的售后）
      operationId: cancelAftersale
      tags:
        - aftersale
      parameters:
        - name: shopId
          in: path
          description: 商户店铺ID
          required: true
          example: 0
          schema:
            type: integer
            format: int64
        - name: id
          in: path
          description: 售后单ID
          required: true
          example: 0
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 取消成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  errno:
                    type: integer
                    example: 0
                  errmsg:
                    type: string
                    example: 成功
                  data:
                    $ref: '#/components/schemas/AftersaleDetail'
          headers: {}
        '400':
          description: 取消原因不能为空
          headers: {}
        '404':
          description: 售后单不存在
          headers: {}
        '409':
          description: 当前状态不允许取消
          headers: {}
      security:
        - bearerAuth: []
  /shops/{shopId}/aftersales/{id}/logs:
    post:
      summary: 商户登记处理备注
      deprecated: false
      description: |-
        ## 用例对应
        为售后单添加处理备注/日志，不改变状态

        ## 界面对应
        - **触发方式**：点击「登记处理结果」按钮
        - **界面元素**：登记处理结果弹窗 (openAftersaleLogForm)
        - **输入内容**：处理备注文本
        - **操作条件**：所有非终态(已完成/已取消)的售后单都可添加备注
        - **界面问题**：当前界面的「登记处理结果」同时支持更新状态和添加备注，建议分离为两个独立操作
      operationId: addAftersaleLog
      tags:
        - aftersale
      parameters:
        - name: shopId
          in: path
          description: 商户店铺ID
          required: true
          example: 0
          schema:
            type: integer
            format: int64
        - name: id
          in: path
          description: 售后单ID
          required: true
          example: 0
          schema:
            type: integer
            format: int64
      responses:
        '201':
          description: 备注添加成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  errno:
                    type: integer
                    example: 0
                  errmsg:
                    type: string
                    example: 成功
                  data:
                    $ref: '#/components/schemas/AftersaleHistory'
          headers: {}
        '400':
          description: 备注内容不能为空
          headers: {}
        '404':
          description: 售后单不存在
          headers: {}
      security:
        - bearerAuth: []
  /shops/{shopId}/aftersales/export:
    get:
      summary: 导出售后单
      deprecated: false
      description: |-
        ## 界面对应
        - **触发方式**：点击顶部「导出售后单」按钮
        - **界面元素**：section__actions 中的导出按钮
        - **功能说明**：根据当前筛选条件导出售后单列表为Excel/CSV文件
        - **返回格式**：文件流（application/octet-stream）
      operationId: exportAftersales
      tags:
        - aftersale
      parameters:
        - name: shopId
          in: path
          description: 商户店铺ID
          required: true
          example: 0
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          description: 售后状态筛选
          required: false
          schema:
            type: integer
            enum:
              - 0
              - 1
              - 2
              - 3
              - 4
              - 5
              - 6
        - name: type
          in: query
          description: 售后类型筛选
          required: false
          schema:
            type: integer
            enum:
              - 0
              - 1
              - 2
              - 3
        - name: startTime
          in: query
          description: 开始时间
          required: false
          schema:
            type: string
            format: date-time
        - name: endTime
          in: query
          description: 结束时间
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: 成功返回文件流
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          headers: {}
        '401':
          description: 未登录
          headers: {}
        '403':
          description: 无权限
          headers: {}
      security:
        - bearerAuth: []
  /orderitems/available-aftersales:
    get:
      summary: 顾客查询可申请售后的订单明细
      deprecated: false
      description: |-
        ## 用例对应
        对应用例：查看可售后的商品

        ## 界面对应
        - **触发方式**：选择售后类型后，显示该类型支持的商品列表
        - **界面元素**：图4-2 选择退款售后商品页面

        ## 业务规则
        - 顾客只能查询到自己的订单明细
        - 已经申请过售后的订单明细不会重复返回
        - 根据售后类型筛选支持该类型的商品
        - 返回商品的售后截止时间
      operationId: getAvailableAftersales
      tags:
        - aftersale
      parameters:
        - name: type
          in: query
          description: 售后类型：0-换货 1-退货 2-寄修 3-上门维修
          required: true
          schema:
            type: integer
            enum:
              - 0
              - 1
              - 2
              - 3
        - name: page
          in: query
          description: 页码，从1开始
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          description: 每页数目
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: 成功返回可申请售后的订单明细列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  errno:
                    type: integer
                    example: 0
                  errmsg:
                    type: string
                    example: 成功
                  data:
                    type: object
                    properties:
                      page:
                        type: integer
                        description: 当前页码
                      pageSize:
                        type: integer
                        description: 每页数目
                      total:
                        type: integer
                        description: 总记录数
                      list:
                        type: array
                        items:
                          $ref: '#/components/schemas/AvailableAftersaleOrderItem'
          headers: {}
        '400':
          description: 参数错误
          headers: {}
        '401':
          description: 未登录
          headers: {}
      security:
